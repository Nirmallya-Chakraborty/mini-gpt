name: Mini GPT CI

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 */2 * *'

jobs:
  build-and-push:
    if: github.actor != 'argocd-image-updater'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Backend
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/mini-gpt-backend:${SHORT_SHA} ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/mini-gpt-backend:${SHORT_SHA}

      # Frontend
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/mini-gpt-frontend:${SHORT_SHA} ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/mini-gpt-frontend:${SHORT_SHA}